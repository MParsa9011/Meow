name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure .env from GitHub Secrets (if set)
        env:
          MYKET_PUBLIC_KEY: ${{ secrets.MYKET_PUBLIC_KEY }}
        run: |
          if [ -n "$MYKET_PUBLIC_KEY" ]; then
            echo "MYKET_PUBLIC_KEY=\"$MYKET_PUBLIC_KEY\"" > .env
            echo "Created .env from GitHub Secrets."
          else
            echo "MYKET_PUBLIC_KEY secret not set; falling back to .env.example."
          fi

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: meow-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        run: gradle assembleRelease --stacktrace

      - name: Check if Keystore Secret is configured
        id: check_keystore
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' && steps.check_keystore.outputs.has_keystore == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: meow-app-release-apk
          path: app/build/outputs/apk/release/*.apk
